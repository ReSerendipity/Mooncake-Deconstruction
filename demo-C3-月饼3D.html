<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>月饼解构 · 3D 空心壳版</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root{
    --ink:#f3ead9; --ink-dim:#a99a86; --gold:#e8c98a; --gold-2:#ffd98a;
    --bg0:#06060a; --bg1:#12101a; --line:rgba(232,201,138,.5);
  }
  html,body{height:100%;}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
    background:
      radial-gradient(900px 520px at 72% 6%, rgba(255,214,140,.10), transparent 62%),
      radial-gradient(700px 500px at 20% 92%, rgba(200,120,70,.10), transparent 60%),
      linear-gradient(160deg,var(--bg1),var(--bg0) 60%);
    color:var(--ink); min-height:100vh; padding:24px 16px 40px; -webkit-font-smoothing:antialiased;
  }
  .app{max-width:1080px;margin:0 auto;}
  .hero{text-align:center;margin-bottom:8px;}
  .kicker{font-size:12px;letter-spacing:5px;color:var(--ink-dim);text-transform:uppercase;}
  .hero h1{font-size:32px;letter-spacing:6px;margin-top:8px;font-weight:800;
    background:linear-gradient(90deg,#fff3d6,#e8c98a 45%,#c98a4a);
    -webkit-background-clip:text;background-clip:text;color:transparent;}
  .hero p{font-size:14px;color:var(--gold);letter-spacing:3px;margin-top:6px;}

  .stage{position:relative;margin-top:2px;}
  #scene{width:100%;aspect-ratio:1000/660;position:relative;border-radius:16px;overflow:hidden;}
  #scene canvas{display:block;width:100%;height:100%;}
  #fallback{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    text-align:center;color:var(--ink-dim);font-size:14px;padding:30px;line-height:1.9;}
  #fallback b{color:var(--gold-2);}
  .toggle{
    position:absolute;right:14px;bottom:14px;
    background:rgba(232,201,138,.12);border:1px solid var(--line);color:var(--gold-2);
    padding:9px 18px;border-radius:999px;font-size:13px;letter-spacing:2px;cursor:pointer;
    backdrop-filter:blur(4px);transition:.25s;z-index:5;
  }
  .toggle:hover{background:rgba(232,201,138,.24);}
  .toggle.sec{right:14px;bottom:58px;}
  .lrow .ld{ }
  .badge{position:absolute;left:14px;top:14px;font-size:12px;letter-spacing:2px;color:var(--ink-dim);
    background:rgba(0,0,0,.28);border:1px solid rgba(232,201,138,.22);padding:5px 11px;border-radius:999px;}

  .panel{margin-top:14px;}
  .tabs{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;}
  .tab{background:rgba(255,255,255,.05);border:1px solid rgba(232,201,138,.22);
    color:var(--ink-dim);padding:8px 15px;border-radius:999px;font-size:13.5px;cursor:pointer;transition:.22s;letter-spacing:1px;}
  .tab:hover{color:var(--ink);border-color:var(--line);}
  .tab.on{background:linear-gradient(90deg,rgba(232,201,138,.28),rgba(201,138,74,.24));
    color:#fff6e2;border-color:var(--gold);font-weight:700;box-shadow:0 0 20px rgba(232,201,138,.22);}

  .lower{display:grid;grid-template-columns:1.15fr .85fr;gap:16px;margin-top:18px;}
  @media (max-width:760px){ .lower{grid-template-columns:1fr;} }
  .card{border:1px solid rgba(232,201,138,.16);border-radius:14px;padding:14px 16px;background:rgba(255,255,255,.022);}
  .card h3{font-size:12.5px;letter-spacing:3px;color:var(--gold);font-weight:600;margin-bottom:11px;text-transform:uppercase;}
  .layerlist{display:flex;flex-direction:column;gap:9px;}
  .lrow{display:flex;align-items:center;gap:11px;font-size:13.5px;opacity:.62;transition:.28s;}
  .lrow.hi{opacity:1;}
  .lrow .sw{width:14px;height:14px;border-radius:4px;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25);}
  .lrow .ln{color:var(--ink);font-weight:600;letter-spacing:1px;min-width:74px;}
  .lrow .ld{color:var(--ink-dim);font-size:12.5px;}
  .metrics{display:flex;flex-direction:column;gap:12px;}
  .m{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--ink-dim);letter-spacing:1px;}
  .m b{color:var(--ink);font-weight:600;letter-spacing:2px;}
  .dots{display:flex;gap:5px;}
  .dots i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.12);display:block;}
  .dots i.on{background:radial-gradient(circle at 35% 35%,#fff2d0,#e8c98a);box-shadow:0 0 8px rgba(232,201,138,.7);}
  .kcal{margin-top:2px;padding-top:12px;border-top:1px solid rgba(232,201,138,.14);}
  .kcal b{color:var(--gold-2);font-size:17px;}
  .foot{text-align:center;font-size:12px;color:#6f6558;margin-top:24px;letter-spacing:1px;}
  .hint{text-align:center;font-size:12px;color:#6f6558;margin-top:8px;letter-spacing:1px;}
  /* 点击拾取：跟随点击位置的浮动信息卡（不拦截鼠标） */
  .tip{position:absolute;display:none;z-index:8;max-width:236px;pointer-events:none;
    background:linear-gradient(180deg,rgba(30,23,14,.96),rgba(18,14,10,.97));
    border:1px solid rgba(232,201,138,.5);border-radius:12px;padding:9px 12px 10px;
    box-shadow:0 12px 30px rgba(0,0,0,.55);backdrop-filter:blur(6px);}
  .tip .td{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px;vertical-align:middle;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.35);}
  .tip b{color:#fff3d6;font-size:13.5px;letter-spacing:1px;vertical-align:middle;}
  .tip .tt{display:block;margin-top:5px;font-size:12px;color:var(--ink-dim);line-height:1.55;letter-spacing:.4px;}
  .lrow.pick{opacity:1;background:linear-gradient(90deg,rgba(232,201,138,.16),transparent);
    box-shadow:inset 3px 0 0 var(--gold);border-radius:6px;padding-left:7px;}
</style>
</head>
<body>
<div class="app">
  <header class="hero">
    <div class="kicker">Mooncake Deconstructed · 3D</div>
    <h1 id="mName">广式莲蓉蛋黄</h1>
    <p id="mTag">经典之味 · 油润起沙</p>
  </header>

  <div class="stage">
    <div id="scene">
      <div id="fallback">Three.js 资源加载失败（可能无外网）。<br/>请改用 <b>demo-C2-月饼解构.html</b>（纯 SVG 版）查看。</div>
    </div>
    <div class="tip" id="tip"></div>
    <div class="badge" id="badge">完整实物</div>
    <button class="toggle sec" id="sectionBtn">切面</button>
    <button class="toggle" id="toggle">展开分层</button>
  </div>
  <div class="hint">拖动旋转 · 滚轮缩放 · 点击月饼查看该处信息 · 右下角可「展开分层 / 切面」</div>

  <div class="panel">
    <div class="tabs" id="tabs"></div>
    <div class="lower">
      <div class="card">
        <h3>分层结构</h3>
        <div class="layerlist" id="layers"></div>
      </div>
      <div class="card">
        <h3>风味指标</h3>
        <div class="metrics" id="metrics"></div>
      </div>
    </div>
  </div>

  <p class="foot">Demo · Three.js + 程序化贴图 · 零构建单文件 · 配料为公开常识汇总，仅供活动演示</p>
</div>

}}
</script>

/* ================= 程序化贴图 ================= */
function cv(size){ const c=document.createElement('canvas'); c.width=c.height=size; c.getContext('2d', { willReadFrequently: true }); return c; }
function shade(hex,p){
  const n=parseInt(hex.slice(1),16); let r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  const f=v=> p>=0?Math.round(v+(255-v)*p):Math.round(v*(1+p));
  return `rgb(${f(r)},${f(g)},${f(b)})`;
}
// 由灰度高度画布生成切线空间法线贴图（Sobel 差分）
// —— 相比 bumpMap，法线贴图能在掠射光下更真实地刻画压花浮雕与表面的微小起伏
function heightToNormal(canvas, strength){
  const s=canvas.width, sx=canvas.getContext('2d');
  const src=sx.getImageData(0,0,s,s).data;
  const c=cv(s), cx2=c.getContext('2d');
  const out=cx2.createImageData(s,s), d=out.data;
  const at=(px,py)=>{ const xx=((px%s)+s)%s, yy=((py%s)+s)%s; return src[(yy*s+xx)*4]/255; };
  for(let y=0;y<s;y++){
    for(let px=0;px<s;px++){
      const dx=(at(px-1,y)-at(px+1,y))*strength;
      const dy=(at(px,y-1)-at(px,y+1))*strength;
      const len=Math.hypot(dx,dy,1), i=(y*s+px)*4;
      d[i]  =(dx/len*0.5+0.5)*255;
      d[i+1]=(dy/len*0.5+0.5)*255;
      d[i+2]=(1/len*0.5+0.5)*255;
      d[i+3]=255;
    }
  }
  cx2.putImageData(out,0,0);
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; return t;
}

      const at=(px,py)=>{const xx=((px%s)+s)%s, yy=((py%s)+s)%s; return src[(yy*s+xx)*4]/255;};
      for(let y=0;y<s;y++){ for(let px=0;px<s;px++){
        const dx=(at(px-1,y)-at(px+1,y))*strength;
        const dy=(at(px,y-1)-at(px,y+1))*strength;
        const len=Math.hypot(dx,dy,1); const i=(y*s+px)*4;
        out[i]=(dx/len*0.5+0.5)*255; out[i+1]=(dy/len*0.5+0.5)*255; out[i+2]=(1/len*0.5+0.5)*255; out[i+3]=255;
      }}
      self.postMessage({id, buf: out.buffer}, [out.buffer]);
    };`;
    _sobelWorker = new Worker(URL.createObjectURL(new Blob([src], {type:'text/javascript'})));
  }catch(err){ console.warn('sobel worker unavailable, fallback to sync:', err); _sobelWorker = null; }
})();
function sobelAsync(srcCanvas, strength){
  if(!_sobelWorker){ _sobelStats.sync++; return heightToNormal(srcCanvas, strength); }   // 回退：主线程同步
  const s = srcCanvas.width;
  const img = srcCanvas.getContext('2d').getImageData(0,0,s,s);
  return new Promise((resolve)=>{
    let done = false, onMsg = null, timer = null;
    const finish = (tex)=>{ if(done) return; done = true;
      if(timer) clearTimeout(timer);
      if(onMsg) _sobelWorker.removeEventListener('message', onMsg);
      resolve(tex); };
    // 看门狗：Worker 迟迟不回（环境限制/内部异常）时退回主线程同步计算。
    // 注意：传出去的是 getImageData 的副本 buffer，源画布仍完好，可安全重算。
    timer = setTimeout(()=>{ _sobelStats.timeout++; _sobelStats.sync++;
      console.warn('sobel worker timeout -> sync fallback'); finish(heightToNormal(srcCanvas, strength)); }, 3000);
    const id = ++_sobelId;
    onMsg = (e)=>{ if(!e.data || e.data.id !== id) return; _sobelStats.worker++;
      const out = new ImageData(new Uint8ClampedArray(e.data.buf), s, s);
      const c = cv(s), cx = c.getContext('2d'); cx.putImageData(out,0,0);
      const t = new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; finish(t); };
    _sobelWorker.addEventListener('message', onMsg);
    try{ _sobelWorker.postMessage({id, buf:img.data.buffer, s, strength}, [img.data.buffer]); }
    catch(err){ _sobelStats.postfail++; _sobelStats.sync++;
      console.warn('sobel post failed -> sync fallback', err); finish(heightToNormal(srcCanvas, strength)); }
  });
}

  }

// 同一套花纹几何：color 模式画同色系明暗，bump 模式画灰度高度（亮=凸起）

function drawCenterStamp(x, isC, base, light, dark, s, cx, cy, Rr, text){

    x.textAlign='center'; x.textBaseline='middle';
    const cs = String(text).slice(0,2).split('');
    const put = (oy, ox)=>{ if(cs.length>=2){ x.fillText(cs[0], ox, oy-fs*0.55); x.fillText(cs[1], ox, oy+fs*0.55); }
                            else if(cs.length===1){ x.fillText(cs[0], ox, oy); } };
    if(isC){ x.fillStyle = shade(base,-0.52); put(0, s*0.0035); put(s*0.0035, s*0.0035); }
    x.fillStyle = isC ? shade(base,0.50) : 'rgb(248,248,248)';
    put(0, 0);
  }
  x.restore(); x.globalAlpha = 1;
}
function drawMotif(x, mode, base, dark, light, s, cx, cy, Rr, bumpFlag, text){
  const isC = (mode === 'color');
  const fillGrad = (rad)=>{
    const g = x.createRadialGradient(0,0,1,0,0,rad);
    if(isC){ g.addColorStop(0,light); g.addColorStop(0.58,base); g.addColorStop(1,dark); }
    else { g.addColorStop(0,'rgb(244,244,244)'); g.addColorStop(0.58,'rgb(150,150,150)'); g.addColorStop(1,'rgb(38,38,38)'); }
    x.fillStyle = g;
  };
  // 相对圆心，朝外角 a、距心 dist，画一片「半长 len、半宽 wid」的瓣
  const leaf = (a, dist, len, wid, strokeA)=>{
    x.save(); x.rotate(a); x.translate(0,-dist);
    x.globalAlpha = isC?0.94:1; fillGrad(len*0.72);
    x.beginPath(); x.ellipse(0,0,wid,len,0,0,7); x.fill();
    if(isC){
      x.strokeStyle=shade(base,-0.52); x.lineWidth=s*0.0036; x.globalAlpha=Math.min(0.92,strokeA+0.28); x.stroke();
      x.strokeStyle=shade(base,0.22); x.lineWidth=s*0.0016; x.globalAlpha=0.5;
      x.beginPath(); x.ellipse(0,0,wid*0.80,len*0.86,0,0,7); x.stroke();
    }else{
      x.strokeStyle='rgb(24,24,24)'; x.lineWidth=s*0.0042; x.globalAlpha=0.96; x.stroke();
    }
    x.restore();
  };
  x.save(); x.translate(cx, cy); x.lineJoin='round'; x.lineCap='round';

  // ① 最外立边（模具压出的边）
  if(isC){
    x.globalAlpha=.85; x.lineWidth=s*0.016; x.strokeStyle=dark;
    x.beginPath(); x.arc(0,0,Rr*0.948,0,7); x.stroke();
    x.globalAlpha=.55; x.lineWidth=s*0.006; x.strokeStyle=light;
    x.beginPath(); x.arc(0,0,Rr*0.925,0,7); x.stroke();
  } else {
    x.globalAlpha=1; x.lineWidth=s*0.026; x.strokeStyle='rgb(218,218,218)';
    x.beginPath(); x.arc(0,0,Rr*0.942,0,7); x.stroke();
    x.lineWidth=s*0.011; x.strokeStyle='rgb(72,72,72)';
    x.beginPath(); x.arc(0,0,Rr*0.912,0,7); x.stroke();
  }
  // ② 珠圈
  x.globalAlpha = isC?0.50:1;
  for(let i=0;i<80;i++){
    const a=(i/80)*Math.PI*2;
    x.fillStyle = isC ? (i%2? light : shade(base,0.02)) : (i%2?'rgb(200,200,200)':'rgb(122,122,122)');
    x.beginPath(); x.arc(Math.cos(a)*Rr*0.884, Math.sin(a)*Rr*0.884, Rr*0.0095, 0, 7); x.fill();
  }
  // ③ 回纹环带：连续方胜回纹
  {
    const M=48, rin=Rr*0.782, rout=Rr*0.850;
    x.globalAlpha = isC?0.72:1;
    x.strokeStyle = isC ? shade(base,-0.30) : 'rgb(150,150,150)';
    x.lineWidth = isC ? s*0.0060 : s*0.0086;
    x.lineJoin='round'; x.lineCap='round';
    x.beginPath();
    for(let i=0;i<=M;i++){
      const a=(i%M)/M*Math.PI*2, r=(i%2? rout:rin);
      const px=Math.cos(a)*r, py=Math.sin(a)*r;
      if(i===0) x.moveTo(px,py); else x.lineTo(px,py);
    }
    x.stroke();
  }

  // ⑤ 卷草纹环：缠枝 + 螺线卷须 + 小叶
  {
    const N=10, rBase=Rr*0.500;
    x.globalAlpha = isC?0.90:1;
    x.strokeStyle = isC ? shade(base,-0.36) : 'rgb(74,74,74)';
    x.lineWidth = isC ? s*0.0044 : s*0.0056;
    x.lineJoin='round'; x.lineCap='round';
    x.beginPath(); x.arc(0,0,rBase,0,7); x.stroke();          // 缠枝主干
    for(let k=0;k<N;k++){
      const a=(k/N)*Math.PI*2;
      x.save(); x.translate(Math.cos(a)*rBase, Math.sin(a)*rBase); x.rotate(a);
      // 向外卷曲的螺线卷须
      x.beginPath();
      for(let t=0;t<=44;t++){ const tt=t/44, ang=tt*Math.PI*2.3, rad=Rr*0.045*(1-tt*0.86);
        const px=Math.cos(ang)*rad, py=Math.sin(ang)*rad; if(t===0)x.moveTo(px,py); else x.lineTo(px,py); }
      x.stroke();
      // 小叶
      fillGrad(Rr*0.026); x.beginPath();
      x.ellipse(Rr*0.082, Rr*0.026, Rr*0.040, Rr*0.016, -0.5, 0, 7); x.fill();
      x.restore();
    }
  }
  // ⑥ 祥云纹环：如意云头（大瓣 + 两侧小瓣 + 云脚）
  {
    const N=8, rr=Rr*0.645;
    for(let k=0;k<N;k++){
      const a=(k/N)*Math.PI*2 + Math.PI/N;
      x.save(); x.translate(Math.cos(a)*rr, Math.sin(a)*rr); x.rotate(a+Math.PI/2);
      const w=Rr*0.072, h=Rr*0.086;
      x.globalAlpha = isC?0.94:1; fillGrad(h*1.05);
      x.beginPath(); x.arc(0, -h*0.12, w*0.60, 0, 7); x.fill();
      x.beginPath(); x.arc(-w*0.94, h*0.20, w*0.52, 0, 7); x.fill();
      x.beginPath(); x.arc( w*0.94, h*0.20, w*0.52, 0, 7); x.fill();
      x.beginPath(); x.ellipse(0, h*0.44, w*0.70, h*0.26, 0,0,7); x.fill();
      x.strokeStyle = isC ? dark : 'rgb(70,70,70)'; x.lineWidth = s*0.0024;
      x.globalAlpha = isC?0.45:0.7;
      x.beginPath(); x.arc(0, -h*0.12, w*0.60, 0, 7); x.stroke();
      x.beginPath(); x.arc(-w*0.94, h*0.20, w*0.52, 0, 7); x.stroke();
      x.beginPath(); x.arc( w*0.94, h*0.20, w*0.52, 0, 7); x.stroke();
      x.restore();
    }
  }
  // ⑦ 中心印记：开光 + 口味汉字
  drawCenterStamp(x, isC, base, light, dark, s, 0, 0, Rr, text);
  x.restore(); x.globalAlpha=1;
}

async function suTopTextures(base, text){

  gl.addColorStop(0,'rgba(255,228,170,0.26)'); gl.addColorStop(1,'rgba(255,255,255,0)');

  bx.fillStyle='rgb(195,195,195)'; bx.beginPath(); bx.arc(cx,cy,Rr*0.23,0,7); bx.fill();
  const bump=new THREE.CanvasTexture(b); bump.wrapS=bump.wrapT=THREE.RepeatWrapping;

function flakyCanvas(base){

let renderer, scene, camera, controls, group;
let parts = [];                    // {mesh, y0, y1, rate, halfH, radius, name, desc, swatch}
let cur = Math.max(0, Math.min(TYPES.length-1, parseInt(Q.get('type')||'0', 10) || 0)), exploded = false;
const clipPlane = new THREE.Plane(new THREE.Vector3(0,0,-1), -0.002);   // 切面：保留 z<=-0.002
let sectionOn = false, sectionPlate = null;
let rafId = null, fitting = false;
let fitCenter = new THREE.Vector3(), fitDist = 5;
const sharedBump = bumpCanvas(512, 26); sharedBump.repeat.set(2.4,2.4);

async function init(){
  const host = document.getElementById('scene');
  // 性能：显式声明高性能 GPU 偏好（多 GPU 笔记本优先独显）；像素比上限 2，避免高 DPR 屏
  // 下按物理像素 3x 全速渲染。静态截图模式强制 1x，进一步降低无头渲染负荷。
  renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true, powerPreference:'high-performance' });
  renderer.setPixelRatio(STATIC ? 1 : Math.min(devicePixelRatio || 1, PERF.pixelRatioCap));
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 0.88;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  // 阴影按需刷新：autoRotate 是"相机绕固定物体与灯光公转"，阴影始终静止，故关闭逐帧自动更新，
  // 改为仅在物体/灯光真正变动时（构建/切换/展开动画/缩放）刷新一次，省掉每帧 2048² 阴影渲染。
  renderer.shadowMap.autoUpdate = false;
  renderer.localClippingEnabled = true;
  host.appendChild(renderer.domElement);

  scene = new THREE.Scene();
  // 环境反射（IBL）：为油润饼皮 / 蛋黄 / 流心提供柔和的真实反射与高光层次。
  // 若在极弱设备上生成失败则静默降级，仅靠灯光照明，不影响其它功能。
  try{
    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.035).texture;
    pmrem.dispose();
  }catch(err){ console.warn('environment skipped:', err); }
  camera = new THREE.PerspectiveCamera(35, 1000/660, 0.1, 100);

  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = !STATIC;
  controls.dampingFactor = 0.09;
  controls.autoRotate = !STATIC;
  controls.autoRotateSpeed = 0.55;
  controls.minDistance = 2.2; controls.maxDistance = 12;
  controls.enablePan = false;
  controls.addEventListener('start', ()=>{ controls.autoRotate = false; startLoop(); });
  controls.addEventListener('change', ()=> startLoop());

  // ---- 点击拾取：点击月饼任意位置 → 在该处弹出对应分层的信息 ----
  const raycaster = new THREE.Raycaster();
  const ndc = new THREE.Vector2();
  let ptrDown = null;
  const tipEl = document.getElementById('tip');
  const sceneBox = ()=> document.getElementById('scene').getBoundingClientRect();
  const clearPick = ()=>{
    tipEl.style.display='none';
    document.querySelectorAll('#layers .lrow').forEach(el=> el.classList.remove('pick'));
  };
  const partOf = (obj)=>{ for(let i=0;i<parts.length;i++){ let o=obj; while(o){ if(o===parts[i].mesh) return parts[i]; o=o.parent; } } return null; };
  const showPick = (part, cx, cy)=>{
    const r = sceneBox();
    tipEl.innerHTML = '<span class="td" style="background:'+part.swatch+'"></span><b>'+part.name+'</b>'+
                      '<span class="tt">'+part.desc+'</span>';
    tipEl.style.display='block';
    let x = cx - r.left + 14, y = cy - r.top + 14;
    const tw = tipEl.offsetWidth, th = tipEl.offsetHeight;
    if(x + tw > r.width - 6)  x = Math.max(6, cx - r.left - tw - 14);
    if(y + th > r.height - 6) y = Math.max(6, cy - r.top  - th - 14);
    tipEl.style.left = x+'px'; tipEl.style.top = y+'px';
    document.querySelectorAll('#layers .lrow').forEach(el=> el.classList.remove('pick'));
    const rows = document.querySelectorAll('#layers .lrow');
    const ri = parts.length - 1 - parts.indexOf(part);      // 列表是自上而下反向排列的
    if(rows[ri]) rows[ri].classList.add('pick');
  };
  const pickAt = (cx, cy)=>{
    const r = sceneBox();
    ndc.x = ((cx - r.left)/r.width)*2 - 1;
    ndc.y = -((cy - r.top)/r.height)*2 + 1;
    raycaster.setFromCamera(ndc, camera);
    const hits = raycaster.intersectObjects(group.children, true);
    for(let i=0;i<hits.length;i++){ const p = partOf(hits[i].object); if(p){ showPick(p, cx, cy); return; } }
    clearPick();
  };
  const dom = renderer.domElement;
  dom.addEventListener('pointerdown', e=>{ ptrDown = {x:e.clientX, y:e.clientY}; clearPick(); });
  dom.addEventListener('pointerup', e=>{
    if(!ptrDown) return;
    const moved = Math.hypot(e.clientX-ptrDown.x, e.clientY-ptrDown.y);
    ptrDown = null;
    if(moved > 6) return;                                   // 判定为拖动旋转，不触发拾取
    pickAt(e.clientX, e.clientY);
  });
  dom.addEventListener('pointerleave', ()=> { ptrDown = null; });
  window.__pickAt = pickAt;                                 // 供自动化测试调用

  // 灯光：环境贴图负责基础照明与反射，方向光提供轮廓高光与阴影（强度已相应下调避免过曝）
  scene.add(new THREE.HemisphereLight(0xfff1d8, 0x241609, 0.12));
  const key = new THREE.DirectionalLight(0xfff4e2, 1.95);
  key.position.set(2.6, 4.4, 3.0);
  key.castShadow = true; key.shadow.mapSize.set(2048,2048);
  key.shadow.camera.near=0.5; key.shadow.camera.far=24;
  key.shadow.camera.left=-3.4; key.shadow.camera.right=3.4; key.shadow.camera.top=4.6; key.shadow.camera.bottom=-2.4;
  key.shadow.bias=-0.0006; key.shadow.radius=4;
  scene.add(key);
  const fill = new THREE.DirectionalLight(0x9db8ff, 0.38); fill.position.set(-3.2,1.4,-2.4); scene.add(fill);
  const rim  = new THREE.DirectionalLight(0xffd9a0, 0.55); rim.position.set(-1.4, 2.0, -3.4); scene.add(rim);

  const ground = new THREE.Mesh(new THREE.PlaneGeometry(16,16), new THREE.ShadowMaterial({opacity:0.34}));
  ground.rotation.x = -Math.PI/2; ground.position.y = 0.0; ground.receiveShadow = true;
  scene.add(ground);

  await buildType(TYPES[cur]);
  resize(true);
  window.addEventListener('resize', ()=> resize(false));

  // 首帧
  applyFit(false, true);
  renderer.shadowMap.needsUpdate = true; forceShadow = true;   // 强制首次阴影计算
  renderer.render(scene, camera);
  window.__ready = true;

  if(Q.has('verifyall')){
    await verifyAll();
    cur = 0; await buildType(TYPES[0]); applyFit(false, true);
    renderer.shadowMap.needsUpdate = true; forceShadow = true;
    renderer.render(scene, camera);
  }

  startLoop();

  if(AUTO_EXPLODE){ setExploded(true); }
}

// 空心壳（车削）：上宽下收的模具形 + 圆肩圆底 + 直筒内腔 + 侧壁压边
function cupGeometry(){
  const Rc = RC;                   // 直筒内腔半径（保证内馅不穿透）
  const pts = [
    new THREE.Vector2(0.00, 0.00),
    new THREE.Vector2(R*0.90, 0.00),     // 平底
    new THREE.Vector2(R*0.935, 0.016),   // 底部小倒角
    new THREE.Vector2(R*0.975, 0.06),
    new THREE.Vector2(R*0.995, 0.14)
  ];
  // 侧壁竖直段加密采样：每段都有顶点，竖沟槽"边牙"才能平滑成形
  const yA = 0.14, yB = H, nSeg = 26;
  for(let i=1;i<=nSeg;i++) pts.push(new THREE.Vector2(R, yA + (yB-yA)*(i/nSeg)));
  pts.push(new THREE.Vector2(Rc, H));   // 顶沿 → 内腔
  pts.push(new THREE.Vector2(Rc, 0.115));
  pts.push(new THREE.Vector2(Rc-0.022, T));
  pts.push(new THREE.Vector2(R*0.86, T));
  pts.push(new THREE.Vector2(0.00, T));
  const g = new THREE.LatheGeometry(pts, 300);
  // 注：已核对 Three.js 源码（LatheGeometry）：uv.x = i/segments（圆周/角度）、
  // uv.y = j/(pts-1)（母线/纵向）。即 u 本就是"圆周"方向，与 crustCanvas 里
  // 沿 u 排列、沿 u 做 ±s 补绘的"边牙 AO"一致，无需交换 UV。
  // 侧壁"边牙"：模具压制形成的一圈竖向圆润沟槽（传统广式月饼的标志性特征）
  const pos = g.attributes.position, v = new THREE.Vector3();
  const RIBS = 32, AMP = 0.026;              // 32 条边牙（正面可见 ~16 条，贴近实物）
  const yLo = 0.05, yHi = H - 0.08;          // 自近底部一直延伸到顶面花边下方
  const rr0 = Rc + 0.012, rr1 = Rc + 0.05;   // 仅作用于外壁
  const sstep = t => { t = Math.max(0, Math.min(1, t)); return t*t*(3-2*t); };
  for(let i=0;i<pos.count;i++){
    v.fromBufferAttribute(pos, i);
    if(v.y <= yLo || v.y >= yHi) continue;
    const r = Math.hypot(v.x, v.z);
    if(r <= rr0) continue;                    // 内腔/内底/平底：不动
    const wy = Math.sin(((v.y - yLo)/(yHi - yLo)) * Math.PI);   // 上下两端渐隐
    const wr = sstep((r - rr0)/(rr1 - rr0));
    const w = wy * wr;
    const th = Math.atan2(v.z, v.x);
    const u = ((th*RIBS/(Math.PI*2)) % 1 + 1) % 1;   // 每条边牙内的相位 0..1
    const sm = t => t*t*(3-2*t);
    let g;                                            // 0=凸脊(平), 1=凹槽(平)，之间为陡壁
    if(u < 0.32) g = 0;
    else if(u < 0.50) g = sm((u-0.32)/0.18);
    else if(u < 0.82) g = 1;
    else g = 1 - sm((u-0.82)/0.18);
    // 每条边牙的深浅略有差异（模拟模具磨损/压制不均）
    const twoPi = Math.PI*2;
    const ribId = Math.floor((((th % twoPi)+twoPi)%twoPi) / twoPi * RIBS);
    const hsh = Math.sin(ribId*12.9898)*43758.5453;
    const jit = 0.82 + 0.36*(hsh - Math.floor(hsh));

    const wob = (0.0045*Math.sin(2*th+1.2) + 0.0032*Math.sin(3*th+0.4)) * w;
    const nr = r * (1 - AMP * jit * g * w + wob);     // 沟槽向内；凸脊仍≈R，与顶盖侧壁齐平
    pos.setX(i, Math.cos(th)*nr); pos.setZ(i, Math.sin(th)*nr);
  }
  pos.needsUpdate = true;
  g.computeVertexNormals();
  g.translate(0, -H/2, 0);     // 居中：使 mesh.position.y 统一表示"中心"
  return g;
}

// 切面贴图：顶皮 / 侧壁 / 底皮 / 馅料 / 蛋黄
function sectionCanvas(type){
  const W=1024, Hc=Math.round(W*H/(2*R));
  const c=cv(1); c.width=W; c.height=Hc;
  const x=c.getContext('2d'); const px=W/(2*R);
  const Y = yw => Hc - yw*px;
  x.fillStyle=type.fill.c; x.fillRect(0,0,W,Hc);                       // 馅料
  for(let i=0;i<9000;i++){ x.fillStyle = Math.random()<0.5?shade(type.fill.c,0.14):shade(type.fill.c,-0.18);
    x.globalAlpha=0.16; x.fillRect(Math.random()*W, Math.random()*Hc, 2,2); }
  x.globalAlpha=1;
  if(type.core){                                                       // 蛋黄
    const cy = type.flaky ? (Math.max(2,(type.layers||4)-1)*0.16 + (type.fill.h+0.12)/2)
                          : (0.105 + (H-0.045-0.105)*0.52);
    const cx0=W/2, row=Y(cy), rr=type.core.r*px;
    const g=x.createRadialGradient(cx0-rr*0.30, row-rr*0.30, rr*0.12, cx0, row, rr);
    g.addColorStop(0, shade(type.core.c,0.26)); g.addColorStop(1, shade(type.core.c,-0.26));
    x.fillStyle=g; x.beginPath(); x.arc(cx0,row,rr,0,7); x.fill();
    x.globalAlpha=0.5; x.strokeStyle=shade(type.core.c,-0.45); x.lineWidth=3;
    x.beginPath(); x.arc(cx0,row,rr*0.98,0,7); x.stroke();
    for(let i=0;i<3000;i++){                       // 蛋黄"起沙"颗粒
      const a=Math.random()*Math.PI*2, rad=Math.sqrt(Math.random())*rr;
      x.fillStyle = Math.random()<0.5? shade(type.core.c,0.26):shade(type.core.c,-0.28);
      x.globalAlpha=0.35; x.fillRect(cx0+Math.cos(a)*rad, row+Math.sin(a)*rad, 1.7, 1.7);
    }
    x.globalAlpha=1;
  }
  x.fillStyle=type.shell.c;                                            // 外皮
  const wall=Math.max(16, 0.055*px);
  x.fillRect(0,0,wall,Hc); x.fillRect(W-wall,0,wall,Hc);
  x.fillRect(0,0,W, Math.max(10, LIDH*px));
  x.fillRect(0, Hc-Math.max(14,T*px), W, Math.max(14,T*px));
  x.globalAlpha=0.32; x.strokeStyle=shade(type.shell.c,-0.5); x.lineWidth=2;
  x.strokeRect(wall, Math.max(10,LIDH*px), W-2*wall, Hc-Math.max(10,LIDH*px)-Math.max(14,T*px)); x.globalAlpha=1;
  for(let i=0;i<6000;i++){                       // 馅料纤维

    x.strokeStyle = Math.random()<0.5? shade(type.fill.c,0.16):shade(type.fill.c,-0.20);
    x.globalAlpha=0.22; x.lineWidth=1.1;

  }

  const shh=x.createLinearGradient(0,0,W,0);
  shh.addColorStop(0,'rgba(0,0,0,0.30)'); shh.addColorStop(0.12,'rgba(0,0,0,0)');
  shh.addColorStop(0.88,'rgba(0,0,0,0)'); shh.addColorStop(1,'rgba(0,0,0,0.30)');
  x.fillStyle=shh; x.fillRect(0,0,W,Hc);
  const shv=x.createLinearGradient(0,Hc,0,Hc*0.82);
  shv.addColorStop(0,'rgba(0,0,0,0.24)'); shv.addColorStop(1,'rgba(0,0,0,0)');

}
function crustSliceCanvas(hex){

    x.globalAlpha=0.16; x.fillRect(Math.random()*s,Math.random()*s,2,2); }

function buildSectionPlate(type){
  if(sectionPlate){
    scene.remove(sectionPlate);
    sectionPlate.traverse(o=>{ if(o.geometry) o.geometry.dispose();
      if(o.material){ (Array.isArray(o.material)?o.material:[o.material]).forEach(m=>{ if(m.map)m.map.dispose(); m.dispose(); }); } });
    sectionPlate=null;
  }
  const g = new THREE.Group();
  const flaky = !!type.flaky;
  const fillR = R*0.88;
  const n = Math.max(2,(type.layers||4)-1);
  const fillBot = flaky ? (n*0.16 + 0.06) : 0.105;
  const fillH   = flaky ? type.fill.h : (H-0.045-0.105);
  const fillTop = fillBot + fillH;
  const cy0 = flaky ? (n*0.16 + (type.fill.h+0.12)/2) : (0.105 + fillH*0.52);
  const mk = (geo, mat, z)=>{ const m=new THREE.Mesh(geo, mat); m.position.z=z; g.add(m); return m; };

  // ① 外壳断面（Π 形：左右壁 + 底）
  const sh = new THREE.Shape();
  sh.moveTo(RC, H); sh.lineTo(R, H); sh.lineTo(R, 0); sh.lineTo(-R, 0); sh.lineTo(-R, H);
  sh.lineTo(-RC, H); sh.lineTo(-RC, T); sh.lineTo(RC, T); sh.closePath();
  mk(new THREE.ShapeGeometry(sh, 8),
     new THREE.MeshStandardMaterial({ map:crustSliceCanvas(type.shell.c), roughness:0.72, metalness:0.0, side:THREE.DoubleSide }),
     -0.0024);

  // ② 顶皮断面（横跨整个直径，补上剖面顶部）
  const lidSh = new THREE.Shape();
  lidSh.moveTo(-R, H-LIDH); lidSh.lineTo(R, H-LIDH); lidSh.lineTo(R, H); lidSh.lineTo(-R, H); lidSh.closePath();
  mk(new THREE.ShapeGeometry(lidSh, 8),
     new THREE.MeshStandardMaterial({ map:crustSliceCanvas(type.shell.c), roughness:0.72, metalness:0.0, side:THREE.DoubleSide }),
     -0.0025);

  // ③ 馅料断面：填满内腔，上下与皮严丝相接（避免空洞/黑块）
  const fw = RC;
  const fillSh = new THREE.Shape();
  fillSh.moveTo(-fw, T); fillSh.lineTo(-fw, H-LIDH); fillSh.lineTo(fw, H-LIDH); fillSh.lineTo(fw, T); fillSh.closePath();
  mk(new THREE.ShapeGeometry(fillSh, 8),
     new THREE.MeshStandardMaterial({ map:pasteCanvas(type.fill.c, !!type.speckle), color:new THREE.Color('#d8cba8'),
        roughness:0.86, metalness:0.0, side:THREE.DoubleSide }),
     -0.0019);

  // ④ 蛋黄断面：用圆盘几何 + 顶点微扰（比自定义 Shape 可靠，不会有三角化空洞）
  if(type.core){
    const rr = type.core.r;
    const yolkSlice = (k, mat, z)=>{
      const geo = new THREE.CircleGeometry(rr*k, 72);
      const p = geo.attributes.position;
      for(let i=0;i<p.count;i++){
        const x=p.getX(i), y=p.getY(i), r=Math.hypot(x,y);
        if(r < 1e-5) continue;
        const a=Math.atan2(y,x), w=1+0.05*Math.sin(4*a+1.0)+0.025*Math.sin(7*a+2.2);
        p.setX(i, x*w); p.setY(i, y*w*0.90);
      }
      p.needsUpdate = true; geo.computeVertexNormals();
      const m = new THREE.Mesh(geo, mat); m.position.set(0, cy0, z); g.add(m); return m;
    };
    yolkSlice(1.05, new THREE.MeshBasicMaterial({ color:0x4a3410, side:THREE.DoubleSide, transparent:true, opacity:0.26 }), -0.00155);
    yolkSlice(0.99, new THREE.MeshStandardMaterial({ map:yolkCanvas(type.core.c), roughness:0.5, metalness:0.0, side:THREE.DoubleSide }), -0.00135);
  }

  sectionPlate = g;
  g.visible = sectionOn;
  scene.add(g);
}

function discGeometry(rTop, rBot, h, seg){

// 带"边牙"竖沟槽的圆筒（用于苏式酥皮外圈）
function flutedCylinder(rTop, rBot, h, seg, ribs, amp){
  const g = new THREE.CylinderGeometry(rTop, rBot, h, seg||160, 1, true);
  const pos = g.attributes.position, v = new THREE.Vector3();
  const sm = t => t*t*(3-2*t);
  for(let i=0;i<pos.count;i++){
    v.fromBufferAttribute(pos,i);
    const r = Math.hypot(v.x, v.z); if(r < 1e-4) continue;
    const th = Math.atan2(v.z, v.x);
    const u = ((th*ribs/(Math.PI*2)) % 1 + 1) % 1;
    let gg;
    if(u < 0.32) gg = 0; else if(u < 0.50) gg = sm((u-0.32)/0.18);
    else if(u < 0.82) gg = 1; else gg = 1 - sm((u-0.82)/0.18);
    const nr = r * (1 - amp*gg);
    pos.setX(i, Math.cos(th)*nr); pos.setZ(i, Math.sin(th)*nr);
  }
  pos.needsUpdate = true; g.computeVertexNormals();
  return g;
}
// 馅料：平底 + 微鼓侧壁 + 圆润顶面（有芯时带一个浅凹窝承托蛋黄），并带极轻微的不规则
function pasteGeometry(rOut, h, coreR){
  const dip = coreR ? Math.min(coreR*0.34, h*0.12) : 0;
  const cav = coreR ? Math.min(rOut*0.70, coreR*1.12) : 0;
  const pts = [
    new THREE.Vector2(0.00, 0.00),
    new THREE.Vector2(rOut*0.982, 0.00),
    new THREE.Vector2(rOut*0.999, 0.016),          // 底缘小圆角
    new THREE.Vector2(rOut, h*0.30),
    new THREE.Vector2(rOut*0.998, h*0.58),         // 侧壁微鼓
    new THREE.Vector2(rOut*0.972, h*0.80)
  ];
  if(dip > 0){
    pts.push(new THREE.Vector2(rOut*0.90, h*0.94));
    pts.push(new THREE.Vector2(cav, h*0.965));
    for(let i=1;i<=7;i++){ const t=i/7; pts.push(new THREE.Vector2(cav*(1-t), h*0.965 - dip*Math.sin(t*Math.PI*0.5))); }
  } else {
    pts.push(new THREE.Vector2(rOut*0.86, h*0.92));
    pts.push(new THREE.Vector2(rOut*0.52, h*0.985));
    pts.push(new THREE.Vector2(0.00, h));
  }
  const g = new THREE.LatheGeometry(pts, 168);
  const pos = g.attributes.position;                // 低幅不规则：让馅团不像车床件
  for(let i=0;i<pos.count;i++){
    const x=pos.getX(i), y=pos.getY(i), z=pos.getZ(i), r=Math.hypot(x,z);
    if(r < 1e-4) continue;
    const th = Math.atan2(z,x);
    const w = 1 + 0.008*Math.sin(3*th+0.6) + 0.004*Math.sin(7*th+2.1);
    pos.setX(i, Math.cos(th)*r*w); pos.setZ(i, Math.sin(th)*r*w);
  }
  pos.needsUpdate = true;
  g.computeVertexNormals();
  g.translate(0, -h/2, 0);
  return g;
}
// 咸蛋黄：压扁 + 顶部微凹（胚心）+ 轻微不规则，比纯球体更像真蛋黄
function yolkGeometry(r){
  const g = new THREE.SphereGeometry(r, 80, 60);
  const pos = g.attributes.position;
  for(let i=0;i<pos.count;i++){
    let x=pos.getX(i), y=pos.getY(i), z=pos.getZ(i);
    y *= 0.74;
    const rr = Math.hypot(x,z);
    if(y > 0) y -= 0.10*r*Math.exp(-(rr*rr)/(0.35*r*r));   // 顶部微凹
    const w = 1 + 0.030*Math.sin(4*Math.atan2(z,x)+1.0)*(rr/Math.max(r,1e-6));
    pos.setX(i, x*w); pos.setY(i, y); pos.setZ(i, z*w);
  }
  pos.needsUpdate = true;
  g.computeVertexNormals();
  return g;
}

async function crustMaterial(t){
  if(DBG) return new THREE.MeshPhysicalMaterial({ color:0x22c55e, roughness:0.5, side:THREE.DoubleSide });
  const map = crustCanvas(t.shell.c, t.shell.c2);
  const normal = await sobelAsync(bumpCanvas(512, 12).image, 3.0);   // 烘焙斑驳 + 气孔的细微起伏
  const rough = roughCanvas(58, 178);                              // 粗糙度不均：油润处更光、哑处更糙
  // 圆周方向贴图密度补偿（真实感主因之一）：饼身周长(2πR≈6.79) 约为壁高(H≈0.94) 的 7 倍，
  // 同一张"方形"贴图贴到侧壁上时，纵向采样密度远高于横向 → 各向同性的斑驳/气孔被横向拉伸成
  // 一道道"水波状"横带，读起来像木纹/瓦楞（这才是"不像月饼"的主要残留）。
  // 补偿 = 加密【圆周】平铺 2 倍，使颗粒恢复各向同性。
  // 注意：颜色贴图内含"边牙沟槽 AO"，必须与几何上 32 条边牙逐条对齐，所以把 AO 内部频率
  // 设为 16、再平铺 2 倍 → 16×2 = 32，既加密又逐条对齐（tile 边界相位也对齐）。
  // 实测：平铺 4×（AO 8）会让竖向条纹过碎，2× 观感最佳。
  map.repeat.set(2, 1); normal.repeat.set(2, 1); rough.repeat.set(2, 1);
  return new THREE.MeshPhysicalMaterial({
    map, normalMap:normal, normalScale:new THREE.Vector2(0.62,0.62),
    roughnessMap:rough, roughness:1.0, metalness:0.0,
    clearcoat:0.62, clearcoatRoughness:0.22,        // 刷蛋液回油后的温润釉面
    envMapIntensity:0.45,
    sheen:0.15, sheenRoughness:0.75, sheenColor:new THREE.Color(0xffdca6),   // 细微粉质绒感（很淡）
    side:THREE.DoubleSide
  });
}

/* ---------- 按类型缓存材质/纹理（切换类型不再重建，消除卡顿） ---------- */
const _matCache = new Map();      // typeKey -> Promise<materials>（已 resolve 后同样直接命中）
const _cachedMats = new Set();    // 已建成的缓存材质，供 disposeGroup 跳过（Promise 无法直接遍历）
function getMaterials(type){
  const key = type.id + (USE_PHOTO_TOP ? '_p' : '_m');
  let b = _matCache.get(key);
  if(b) return b;
  b = (async ()=>{
    const [crustMat, fillMat] = await Promise.all([crustMaterial(type), fillMaterial(type)]);
    const out = { crustMat, fillMat };
    if(type.flaky){
      const flakyTex = flakyCanvas(type.shell.c);
      const [flakyNormal, suTx] = await Promise.all([
        // 酥皮碎屑：细密高频凹凸（起酥掉渣的微观质感），法线强度加大
        sobelAsync(crumbBump(512).image, 2.2),
        suTopTextures(type.shell.c, type.stamp)
      ]);
      // 偏白偏光滑 → 改哑光起酥：碎屑法线 + 降清漆/绒光、提粗糙度、压环境反射。
      // 金调由 shell.c 加暖（见 TYPES 苏式定义）实现，albedo 本身即呈烘焙金棕。
      const flakyMat = new THREE.MeshPhysicalMaterial({ map:flakyTex,
        normalMap:flakyNormal, normalScale:new THREE.Vector2(1.0,1.0),
        roughness:0.74, metalness:0.0, clearcoat:0.10, clearcoatRoughness:0.72, envMapIntensity:0.60,
        sheen:0.28, sheenRoughness:0.92, sheenColor:new THREE.Color(0xffe9c2), side:THREE.DoubleSide });
      const suTopMat = new THREE.MeshPhysicalMaterial({ map:suTx.map, normalMap:suTx.normal, normalScale:new THREE.Vector2(1.0,1.0),
        roughness:0.58, metalness:0.0, clearcoat:0.18, clearcoatRoughness:0.55, envMapIntensity:0.72,
        sheen:0.18, sheenRoughness:0.85, sheenColor:new THREE.Color(0xffe0b0) });
      out.flakyMat = flakyMat; out.flakyTex = flakyTex; out.suTopMat = suTopMat;
    } else {
      const stx = await stampTextures(type.shell.c, type.stamp, !!type.shot && USE_PHOTO_TOP);
      out.lidTopMat = type.baked
        ? new THREE.MeshPhysicalMaterial({ map:stx.map, normalMap:stx.normal, normalScale:new THREE.Vector2(1.5,1.5),
            roughness:0.40, metalness:0.0, clearcoat:0.55, clearcoatRoughness:0.30, envMapIntensity:0.62,
            sheen:0.16, sheenRoughness:0.7, sheenColor:new THREE.Color(0xffdca6) })
        : new THREE.MeshPhysicalMaterial({ map:stx.map, normalMap:stx.normal, normalScale:new THREE.Vector2(0.62,0.62),
            roughness:0.34, metalness:0.0, clearcoat:0.42, clearcoatRoughness:0.30, envMapIntensity:0.60,
            sheen:0.55, sheenRoughness:0.8, sheenColor:new THREE.Color(0xffffff) });
    }
    for(const v of Object.values(out)) if(v && v.isMaterial) _cachedMats.add(v);
    return out;
  })();
  _matCache.set(key, b);
  return b;
}

let texCache = [];
function disposeGroup(){
  if(!group) return;
  const cached = _cachedMats;   // 缓存材质（含其贴图）：跨类型切换复用，不可释放
  group.traverse(o=>{
    if(o.geometry) o.geometry.dispose();
    if(o.material){ (Array.isArray(o.material)?o.material:[o.material]).forEach(m=>{
        if(cached.has(m)) return;   // 缓存材质：保留材质与贴图，跨类型切换复用
        if(m.map)m.map.dispose(); if(m.bumpMap && m.bumpMap!==sharedBump)m.bumpMap.dispose(); if(m.normalMap)m.normalMap.dispose(); if(m.roughnessMap)m.roughnessMap.dispose(); m.dispose();
    }); }
  });
  scene.remove(group); group = null; parts = [];
}

async function buildType(type){

  const { crustMat, fillMat } = await getMaterials(type);

  if(type.flaky){
    /* ===== 苏式：底部酥皮层 + 酥皮外圈（包裹馅心）+ 馅 + 芯 + 顶酥 ===== */
    const n = Math.max(2, (type.layers||4) - 1);        // 底部酥皮层数
    const { flakyMat } = await getMaterials(type);
    const lh = 0.16;
    for(let i=0;i<n;i++){
      const rr = R*(1 - i*0.015);
      const m = new THREE.Mesh(discGeometry(rr, rr*0.99, lh, 96), flakyMat);
      m.castShadow = true; m.receiveShadow = true;
      const y0 = lh/2 + i*lh;
      group.add(m);
      parts.push({ mesh:m, y0, y1:y0, rate:0.06*SPEED, halfH:lh/2, radius:rr,
        name:'酥皮层 '+(i+1), desc:'水面皮裹油酥 · 反复擀叠', swatch:type.shell.c2 });
    }
    const baseTop = n*lh;
    const fillH = type.fill.h;
    const fillR = R*0.88;
    const sleeveH = fillH + 0.12;
    // 酥皮外圈：把馅心裹在里面，完整态看不出馅
    const sleeve = new THREE.Mesh(
      flutedCylinder(R*0.985, R*0.965, sleeveH, 168, 32, 0.026), flakyMat);
    sleeve.castShadow = true; sleeve.receiveShadow = true;
    const sy0 = baseTop + sleeveH/2;
    group.add(sleeve);
    parts.push({ mesh:sleeve, y0:sy0, y1:sy0, rate:0.075*SPEED, halfH:sleeveH/2, radius:R*0.985,
      name:'酥皮外圈', desc:'层层包裹馅心 · 起酥要诀', swatch:type.shell.c });
    // 馅（藏在外圈内）
    const fm = new THREE.Mesh(pasteGeometry(fillR, fillH, type.core?type.core.r:0), fillMat);
    fm.castShadow = true;
    const fy0 = baseTop + sleeveH/2;
    group.add(fm);
    parts.push({ mesh:fm, y0:fy0, y1:fy0, rate:0.10*SPEED, halfH:fillH/2, radius:fillR,
      name:type.fill.n, desc:type.fill.d, swatch:type.fill.c });
    // 芯
    if(type.core){
      const cm = new THREE.Mesh(yolkGeometry(type.core.r), await coreMaterial(type));
      cm.castShadow = true;
      group.add(cm);
      parts.push({ mesh:cm, y0:fy0, y1:fy0, rate:0.13*SPEED, halfH:type.core.r*0.74, radius:type.core.r,
        name:type.core.n, desc:type.core.d, swatch:type.core.c });
    }
    // 顶酥（带印圆片）
    const topH = 0.16;
    const topMat = (await getMaterials(type)).suTopMat;
    const tm = new THREE.Mesh(discGeometry(R*1.0, R*0.96, topH, 96), [flakyMat, topMat, flakyMat]);
    tm.castShadow = true;
    const ty0 = baseTop + sleeveH + topH/2;
    group.add(tm);
    parts.push({ mesh:tm, y0:ty0, y1:ty0, rate:0.085*SPEED, halfH:topH/2, radius:R*1.0,
      name:'顶酥皮', desc:'表面盖酥 · 红印为记', swatch:type.shell.c2 });

    // 展开目标（自下而上依次抬高）
    layoutExplode();

  } else {
    /* ===== 广式/冰皮：空心壳 + 馅 + 芯 + 压花顶盖 ===== */
    const cup = new THREE.Mesh(cupGeometry(), crustMat);
    cup.castShadow = true; cup.receiveShadow = true;
    cup.position.y = H/2;
    // 内腔饰面：车削 UV 会把贴图在内壁/内底纵向与放射状拉伸（看似撕纸），
    // 故用「干净套筒 + 平铺圆片」覆盖内表面（不影响外壳外观）
    const innerMat = new THREE.MeshStandardMaterial({
      color: new THREE.Color(type.baked? '#d9c49c' : shade(type.shell.c, 0.05)), roughness:0.74, metalness:0.0,
      side: THREE.DoubleSide, bumpMap:sharedBump, bumpScale:0.010
    });
    const sleeveH = H - 0.18;
    const sleeve = new THREE.Mesh(
      new THREE.CylinderGeometry(RC-0.006, RC-0.026, sleeveH, 96, 1, true), innerMat);
    sleeve.position.y = (T + sleeveH/2 + 0.02) - H/2;
    sleeve.receiveShadow = true;
    cup.add(sleeve);
    const innerFloor = new THREE.Mesh(discGeometry(RC-0.028, RC-0.028, 0.028, 96), innerMat);
    innerFloor.position.y = (T + 0.014) - H/2;
    innerFloor.receiveShadow = true;
    cup.add(innerFloor);
    group.add(cup);
    parts.push({ mesh:cup, y0:H/2, y1:H/2, rate:0.055*SPEED, halfH:H/2, radius:R,
      name:type.shell.n, desc:type.shell.d, swatch:type.shell.c });

    const fillR = R*0.88;
    const fillBot = 0.105, fillTop = H - 0.045;
    const fillH = fillTop - fillBot;
    const fm = new THREE.Mesh(pasteGeometry(fillR, fillH, type.core?type.core.r:0), fillMat);
    fm.castShadow = true;
    const fy0 = fillBot + fillH/2;
    fm.position.y = fy0;
    group.add(fm);
    parts.push({ mesh:fm, y0:fy0, y1:fy0, rate:0.095*SPEED, halfH:fillH/2, radius:fillR,
      name:type.fill.n, desc:type.fill.d, swatch:type.fill.c });

    if(type.core){
      const cm = new THREE.Mesh(yolkGeometry(type.core.r), await coreMaterial(type));
      cm.castShadow = true;
      const cy0 = fillBot + fillH*0.52;
      cm.position.y = cy0;
      group.add(cm);
      parts.push({ mesh:cm, y0:cy0, y1:cy0, rate:0.125*SPEED, halfH:type.core.r*0.74, radius:type.core.r,
        name:type.core.n, desc:type.core.d, swatch:type.core.c });
    }

    // 顶盖 = 与饼身同径、侧壁带同款边牙、顶面缓穹（非平盖）
    // → 完整态边牙自饼身连续到顶缘，读作"一整块压模实心饼"，杜绝"盖/盆盖"断面
    const lidR = R;
    const lidGeo = discGeometry(lidR, lidR, LIDH, 300);
    {
      const p = lidGeo.attributes.position, yTop = LIDH/2, yBot = -LIDH/2;
      const RIBS = 32, AMP = 0.026, sstep = t => { t=Math.max(0,Math.min(1,t)); return t*t*(3-2*t); };
      for(let i=0;i<p.count;i++){
        const x=p.getX(i), y=p.getY(i), z=p.getZ(i), r=Math.hypot(x,z);
        if(y >= yTop-1e-4 && r <= lidR*0.985){      // 顶面：缓穹（中心微隆，边缘平，与边牙衔接）
          const t = Math.min(1, r/lidR);
          p.setY(i, yTop + 0.030*(1 - t*t));
        } else if(y <= yBot+1e-4){                    // 底面：坐于内腔口部，保持平整
          // 不动
        } else {                                       // 侧壁：与饼身同款边牙（连续到顶缘）
          const th = Math.atan2(z, x);
          const u = ((th*RIBS/(Math.PI*2)) % 1 + 1) % 1;
          let gg; if(u<0.32) gg=0; else if(u<0.50) gg=sstep((u-0.32)/0.18);
          else if(u<0.82) gg=1; else gg=1-sstep((u-0.82)/0.18);
          const nr = r * (1 - AMP*gg);
          p.setX(i, Math.cos(th)*nr); p.setZ(i, Math.sin(th)*nr);
        }
      }
      p.needsUpdate = true; lidGeo.computeVertexNormals();
    }
    const { lidTopMat } = await getMaterials(type);
    // 顶盖侧壁/顶面与饼身外壁/顶沿在 y∈[H-0.08,H] 共面 → z-fighting 产生近顶淡横带。
    // 用 polygonOffset 让顶盖稳定胜出深度测试（消除闪烁）；盖身边牙半径一致，视觉连续无缝。
    const lidShellMat = crustMat.clone();
    lidShellMat.polygonOffset = true; lidShellMat.polygonOffsetFactor = -1; lidShellMat.polygonOffsetUnits = -2;
    lidTopMat.polygonOffset = true; lidTopMat.polygonOffsetFactor = -1; lidTopMat.polygonOffsetUnits = -2;
    const lid = new THREE.Mesh(lidGeo, [lidShellMat, lidTopMat, lidShellMat]);
    lid.castShadow = true; lid.receiveShadow = true;
    const ly0 = H - LIDH/2;
    lid.position.y = ly0;
    group.add(lid);
    parts.push({ mesh:lid, y0:ly0, y1:ly0, rate:0.075*SPEED, halfH:LIDH/2, radius:lidR,
      name:type.baked?'压花顶盖':'冰皮顶面', desc:type.baked?'顶部模具压花 · 卷草祥云':'糯皮印记 · 冷藏更佳', swatch:type.shell.c2 });

    layoutExplode();
  }

  // 顶点采样（供取景实测使用；各层仅沿 Y 平移，故存局部坐标即可）
  parts.forEach(p=>{
    const pos = p.mesh.geometry.attributes.position;
    const stride = Math.max(1, Math.floor(pos.count / 600));
    const arr = [];
    for(let i=0;i<pos.count;i+=stride){ arr.push(pos.getX(i), pos.getY(i), pos.getZ(i)); }
    p.sample = arr;
  });

  scene.add(group);
  // 记录初始位
  parts.forEach(p=> p.mesh.position.y = p.y0);

  buildSectionPlate(type);
  applyClipping(sectionOn);

  document.getElementById('mName').textContent = type.name;
  document.getElementById('mTag').textContent = type.tag;
  renderLayers(type);
  renderMetrics(type);
  refreshSwitch();
  // 初始视角
  applyFit(exploded, true);
  requestTick();
}

// 计算展开时的堆叠高度（自下而上），保持幂等
function layoutExplode(){
  let bottom = 0;
  parts.forEach((p,i)=>{
    if(i>0) bottom += GAP;
    p.y1 = bottom + p.halfH;
    bottom += p.halfH*2;
  });
}

/* ---------- 相机自适应（保证展开后不超界） ---------- */
function bounds(state){
  let minY=Infinity,maxY=-Infinity,maxR=0;
  parts.forEach(p=>{
    const y = state ? p.y1 : p.y0;
    minY=Math.min(minY, y-p.halfH); maxY=Math.max(maxY, y+p.halfH);
    maxR=Math.max(maxR, p.radius);
  });
  return {minY,maxY,maxR};
}
function computeFit(state){
  const b = bounds(state);
  const cy=(b.minY+b.maxY)/2, hh=Math.max((b.maxY-b.minY)/2, 0.2);
  const vFov=camera.fov*Math.PI/180;
  const hFov=2*Math.atan(Math.tan(vFov/2)*camera.aspect);
  const dV=hh/Math.tan(vFov/2);
  const dH=b.maxR/Math.tan(hFov/2);
  const dist=Math.max(dV,dH)*1.16 + b.maxR*0.85;
  return {center:new THREE.Vector3(0,cy,0), dist:Math.max(dist, 2.4)};
}
const MARGIN_FIT = { collapsed: 0.64, exploded: 0.90 };   // 合拢留白多更耐看；展开铺满
const _v3 = new THREE.Vector3();
// 实测：把各层摆到目标位后，采样真实顶点投影，取最大 |NDC|
function ndcMaxAbs(){
  let m = 0;
  parts.forEach(p=>{
    const py = p.mesh.position.y, S = p.sample;
    for(let i=0;i<S.length;i+=3){
      _v3.set(S[i], S[i+1] + py, S[i+2]).project(camera);
      const ax = Math.abs(_v3.x), ay = Math.abs(_v3.y);
      if(ax > m) m = ax;
      if(ay > m) m = ay;
    }
  });
  return m;
}
function ndcRangeY(){
  let lo=1e9, hi=-1e9;
  parts.forEach(p=>{
    const py = p.mesh.position.y, S = p.sample;
    for(let i=0;i<S.length;i+=3){
      _v3.set(S[i], S[i+1] + py, S[i+2]).project(camera);
      if(_v3.y < lo) lo = _v3.y;
      if(_v3.y > hi) hi = _v3.y;
    }
  });
  return [lo, hi];
}
// 投影实测迭代收敛取景（解析式会低估俯视进深，导致越界）
function fitCamera(state, move){
  const saveY = parts.map(p=>p.mesh.position.y);
  const savePos = camera.position.clone(), saveTgt = controls.target.clone();
  setStateStatic(state);                       // 摆到目标位置再量
  const b = bounds(state);
  fitCenter.set(0, (b.minY + b.maxY)/2, 0);
  // 合拢：略俯视，突出顶部压花；展开：降低俯角，让每层（含蛋黄）都能看清
  const dir = state ? new THREE.Vector3(0.15, 0.44, 1).normalize()
                    : new THREE.Vector3(0.17, 0.55, 1).normalize();
  let dist = Math.max(computeFit(state).dist, 2.4);
  const place = ()=>{
    controls.target.copy(fitCenter);
    camera.position.copy(fitCenter).addScaledVector(dir, dist);
    camera.lookAt(fitCenter);
    camera.updateMatrixWorld(true);
  };
  const MARGIN = state ? MARGIN_FIT.exploded : MARGIN_FIT.collapsed;
  for(let outer=0; outer<4; outer++){
    for(let i=0;i<28;i++){                     // 收敛距离：最大 |NDC| → MARGIN
      place();
      const m = ndcMaxAbs();
      if(Math.abs(m - MARGIN) < 0.006 || i === 27) break;
      dist = Math.max(2.0, Math.min(dist * (m / MARGIN), 40));
    }
    place();
    const [lo, hi] = ndcRangeY();
    const c = (lo + hi) / 2;                   // 垂直居中微调
    if(Math.abs(c) < 0.02) break;
    const viewH = 2 * dist * Math.tan(camera.fov * Math.PI / 360);
    fitCenter.y += c * viewH / 2 * 0.85;
  }
  fitDist = dist;
  parts.forEach((p,i)=> p.mesh.position.y = saveY[i]);   // 还原动画位置
  scene.updateMatrixWorld(true);
  if(move){ controls.update(); }
  else { camera.position.copy(savePos); controls.target.copy(saveTgt); controls.update(); }
}
function applyFit(state, instant){
  fitCamera(state, !!instant);
  if(!instant) fitting = true;
}

/* ---------- 循环（按需渲染） ---------- */
/* ---------- 自适应降级（保证不同性能平台都流畅） ---------- */
let forceShadow = true;     // 物体/灯光真正变动时强制刷新一次阴影贴图（autoUpdate 已关）
let lastRender = 0;         // 上次实际渲染时刻（idle 限帧用）
let _camInit = false; const _camPos = new THREE.Vector3(), _camQuat = new THREE.Quaternion();
let _fullLast = 0, _fullEMA = 0, _costEMA = 0, _perfT0 = 0;

function applyPerf(){
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, PERF.pixelRatioCap));
  resize(true);
}
function downgradeTier(){
  if(PERF.tier >= 2) return;
  PERF.tier++;
  if(PERF.tier === 1){ PERF.pixelRatioCap = 1.0; applyPerf(); }
  else { PERF.pixelRatioCap = 1.0; renderer.shadowMap.enabled = false; applyPerf(); forceShadow = true; }
  console.warn('[perf] 降级 -> tier', PERF.tier, '(pixelRatioCap=' + PERF.pixelRatioCap + ', shadow=' + renderer.shadowMap.enabled + ')');
}
function perfMeasure(now, cost){
  if(STATIC) return;
  _costEMA = _costEMA ? _costEMA*0.9 + cost*0.1 : cost;   // 单帧提交耗时（弱机通常也偏高）
  if(_fullLast){ const dt = now - _fullLast; _fullEMA = _fullEMA ? _fullEMA*0.9 + dt*0.1 : dt; }
  _fullLast = now;
  if(_perfT0 === 0) _perfT0 = now;
  if(now - _perfT0 > 1500){
    _perfT0 = now;
    if(_fullEMA > 24 || _costEMA > 18) downgradeTier();   // 持续 <~40fps 或单帧 >18ms → 降级
  }
}

/* ---------- 循环（按需渲染 + idle 限帧 + 隐藏暂停 + 阴影按需） ---------- */
function requestTick(delay){
  if(rafId != null) return;
  if(delay && delay > 4) rafId = setTimeout(()=>{ rafId = null; tick(); }, delay);
  else rafId = requestAnimationFrame(tick);
}
function startLoop(){ requestTick(0); }
let __settledShot = false;
function tick(){
  rafId = null;
  const now = performance.now();
  const idleInterval = 1000 / PERF.idleFps;
  let partsMoving = false;

  parts.forEach(p=>{
    const t = exploded ? p.y1 : p.y0;
    const d = t - p.mesh.position.y;
    if(Math.abs(d) > 0.0008){ p.mesh.position.y += d * p.rate; partsMoving = true; }
    else p.mesh.position.y = t;
  });

  if(fitting){
    controls.target.lerp(fitCenter, 0.09);
    const off = camera.position.clone().sub(controls.target);
    const cur = off.length(); off.normalize();
    const nd = cur + (fitDist - cur) * 0.09;
    camera.position.copy(controls.target).addScaledVector(off, nd);
    if(Math.abs(nd - fitDist) < 0.01 && controls.target.distanceTo(fitCenter) < 0.004){
      controls.target.copy(fitCenter); camera.position.copy(controls.target).addScaledVector(off, fitDist);
      fitting = false;
    }
    partsMoving = true;
  }

  const idleSpin = (!STATIC && controls.autoRotate);   // 仅"相机公转"这一项运动时按 idle 限帧
  controls.update();
  let camMoved = false;
  if(_camInit){ if(!camera.position.equals(_camPos) || !camera.quaternion.equals(_camQuat)) camMoved = true; }
  else _camInit = true;
  _camPos.copy(camera.position); _camQuat.copy(camera.quaternion);
  const userCamMoved = camMoved && !idleSpin;          // 用户拖拽/阻尼才算满速，自转不算
  if(userCamMoved) partsMoving = true;

  const due = (idleSpin && !partsMoving) ? (now - lastRender) >= idleInterval : true;
  if(due || partsMoving){
    renderer.shadowMap.needsUpdate = forceShadow || partsMoving;   // 仅变动时刷新阴影
    const r0 = performance.now();
    renderer.render(scene, camera);
    const cost = performance.now() - r0;
    if(forceShadow) forceShadow = false;
    lastRender = now;
    const fullSpeed = !idleSpin || partsMoving;        // idle 限帧帧不计入真实帧时
    perfMeasure(fullSpeed ? now : _fullLast, cost);
    if(!__settledShot && !partsMoving && !idleSpin){ __settledShot = true; window.__settled = true; }
  }

  const cont = idleSpin || partsMoving || userCamMoved;
  if(cont){
    const wait = (idleSpin && !partsMoving && !userCamMoved) ? Math.max(0, idleInterval - (now - lastRender)) : 0;
    requestTick(wait);
  } else if(!__settledShot){
    __settledShot = true; window.__settled = true;
  }
}

// 标签页隐藏时彻底停渲染（后台零占用）；回到前台再恢复
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden){
    if(rafId != null){ clearTimeout(rafId); cancelAnimationFrame(rafId); rafId = null; }
  } else { __settledShot = false; startLoop(); }
});

function resize(instant){
  const host = document.getElementById('scene');
  const w = host.clientWidth || 1000, h = w*660/1000;
  renderer.setSize(w, h, false);
  camera.aspect = w/h; camera.updateProjectionMatrix();
  if(instant) applyFit(exploded, true); else { applyFit(exploded, false); startLoop(); }
}

/* ---------- 交互 ---------- */
/* ---------- 数值自检：分层是否越界 / 结构是否互相穿透 ---------- */
function setStateStatic(st){
  parts.forEach(p=> p.mesh.position.y = st ? p.y1 : p.y0);
  scene.updateMatrixWorld(true);
}
async function verifyAll(){
  const box = new THREE.Box3(), gb = new THREE.Box3();
  const REPORT = [];
  for(let i=0;i<TYPES.length;i++){
    cur = i;
    await buildType(TYPES[i]);
    [false, true].forEach(st=>{
      setStateStatic(st);
      applyFit(st, true);
      camera.updateMatrixWorld(true);
      renderer.render(scene, camera);
      let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
      parts.forEach(p=>{
        const py = p.mesh.position.y, S = p.sample;
        for(let i=0;i<S.length;i+=3){
          const v = _v3.set(S[i], S[i+1] + py, S[i+2]).project(camera);
          minX=Math.min(minX,v.x); maxX=Math.max(maxX,v.x);
          minY=Math.min(minY,v.y); maxY=Math.max(maxY,v.y);
        }
      });
      gb.setFromObject(group);
      const fit = (minX>=-1 && maxX<=1 && minY>=-1 && maxY<=1);
      // 结构自检：内馅不得穿透内腔；蛋黄不得穿出内馅
      const fillR = R*0.88, rc = RC;
      let structOK = (fillR < rc);
      const t = TYPES[i];
      // 外壳外半径在内馅高度区间必须大于内馅半径（否则内馅会从侧壁穿出）
      if(!t.flaky){
        const cupMesh = parts[0].mesh, cg = cupMesh.geometry, cp = cg.attributes.position;
        const bins = {};
        for(let k=0;k<cp.count;k++){
          const wy = cp.getY(k) + cupMesh.position.y;
          const r = Math.hypot(cp.getX(k), cp.getZ(k));
          const key = (Math.round(wy*20)/20).toFixed(2);
          bins[key] = Math.max(bins[key]||0, r);
        }
        const lo = 0.105, hi = H-0.045;
        Object.keys(bins).forEach(k=>{
          const y = parseFloat(k);
          if(y >= lo-0.03 && y <= hi+0.03) structOK = structOK && (bins[k] > fillR + 0.008);
        });
      }
      if(t.core){
        const nf      = Math.max(2, (t.layers||4) - 1);
        const fillBot = t.flaky ? (nf*0.16) : 0.105;
        const fillH   = t.flaky ? t.fill.h : (H-0.045-0.105);
        const cy      = t.flaky ? (fillBot + (fillH+0.12)/2) : (fillBot + fillH*0.52);
        const ch      = t.core.r*0.74;
        const fLo = t.flaky ? (fillBot+0.06) : fillBot;
        const fHi = t.flaky ? (fillBot+0.06+fillH) : (fillBot+fillH);
        structOK = structOK && (t.core.r < fillR)
                && (cy-ch > fLo-0.002) && (cy+ch < fHi+0.002);
      }
      REPORT.push({
        t: t.name, st: st?'exploded':'collapsed',
        ndcX: +minX.toFixed(3), ndcX2: +maxX.toFixed(3),
        ndcY: +minY.toFixed(3), ndcY2: +maxY.toFixed(3),
        worldY: +gb.min.y.toFixed(3), worldY2: +gb.max.y.toFixed(3),
        fit, structOK, parts: parts.length
      });
    });
  }
  REPORT.forEach(r=> console.log('VERIFY|' + JSON.stringify(r)));
  const bad = REPORT.filter(r=> !r.fit || !r.structOK);
  console.log('VERIFY-SUMMARY total=' + REPORT.length + ' fail=' + bad.length + (bad.length? ' -> '+JSON.stringify(bad):' ALL-OK'));
  window.__verifyDone = true;
}

function setExploded(v){
  exploded = v;
  if(v && sectionOn){ sectionOn=false; if(sectionPlate) sectionPlate.visible=false; applyClipping(false);
    const sb=document.getElementById('sectionBtn'); if(sb) sb.textContent='切面'; }
  { const te=document.getElementById('tip'); if(te) te.style.display='none'; }
  document.getElementById('toggle').textContent = exploded ? '合拢月饼' : '展开分层';
  document.getElementById('badge').textContent = exploded ? '解构分层' : '完整实物';
  document.querySelectorAll('#layers .lrow').forEach(el=> el.classList.toggle('hi', exploded));
  applyFit(exploded, false);
  __settledShot = false;
  window.__settled = false;      // 复位，便于自动化等待本次动画真正结束
  forceShadow = true;
  startLoop();
}
/* ---------- 文案渲染 ---------- */
function refreshSwitch(){ /* 切换类型时保持展开态视觉一致 */
  document.getElementById('badge').textContent = exploded ? '解构分层' : '完整实物';
  document.querySelectorAll('#layers .lrow').forEach(el=> el.classList.toggle('hi', exploded));
}
function renderLayers(type){
  const box=document.getElementById('layers'); box.innerHTML='';
  [...parts].reverse().forEach(p=>{
    const row=document.createElement('div'); row.className='lrow'+(exploded?' hi':'');
    row.innerHTML = '<span class="sw" style="background:'+p.swatch+'"></span>'+
      '<span class="ln">'+p.name+'</span><span class="ld">'+p.desc+'</span>';
    box.appendChild(row);
  });
}
function renderMetrics(type){
  const box=document.getElementById('metrics'); let html='';
  Object.keys(type.m).forEach(k=>{ const v=type.m[k]; let ds='';
    for(let i=1;i<=5;i++) ds+='<i class="'+(i<=v?'on':'')+'"></i>';
    html+='<div class="m"><b>'+k+'</b><span class="dots">'+ds+'</span></div>'; });
  html+='<div class="m kcal"><span>每块(≈50g)</span><b>'+type.kcal+' kcal</b></div>';
  box.innerHTML=html;
}
function renderTabs(){
  const box=document.getElementById('tabs'); box.innerHTML='';
  TYPES.forEach((t,i)=>{ const b=document.createElement('button');
    b.className='tab'+(i===cur?' on':''); b.textContent=t.name;
    b.onclick=()=>{ cur=i; renderTabs(); forceShadow = true; buildType(TYPES[cur]).catch(e=>console.warn(e)); startLoop(); };
    box.appendChild(b); });
}

function setSection(on){
  sectionOn = on;
  if(on && exploded){ exploded=false; if(sectionPlate) sectionPlate.visible=false; }
  if(sectionPlate) sectionPlate.visible = on;
  applyClipping(on);
  const sb=document.getElementById('sectionBtn'); if(sb) sb.textContent = on ? '合拢' : '切面';
  document.getElementById('toggle').textContent = exploded ? '合拢月饼' : '展开分层';
  document.getElementById('badge').textContent = on ? '剖面视图' : (exploded ? '解构分层' : '完整实物');
  if(on){
    parts.forEach(p=> p.mesh.position.y = p.y0);
    applyFit(false, true);
    const d = camera.position.distanceTo(controls.target);
    camera.position.copy(fitCenter).addScaledVector(new THREE.Vector3(0.02, 0.30, 1).normalize(), d);
    controls.target.copy(fitCenter); camera.lookAt(fitCenter); controls.update();
  }
  __settledShot = false; window.__settled = false;
  forceShadow = true;
  startLoop();
}
document.getElementById('toggle').onclick = ()=> setExploded(!exploded);
document.getElementById('sectionBtn').onclick = ()=> setSection(!sectionOn);
renderTabs();

// init 为 async，同步 try/catch 抓不到其内部异常，必须用 .catch 兜住
init().catch(e=>{
  console.error(e);
  document.getElementById('fallback').style.display='flex';
  document.getElementById('toggle').style.display='none';
});
setTimeout(()=>{ if(!window.__ready){ document.getElementById('fallback').style.display='flex'; } }, 14000);
</script>
