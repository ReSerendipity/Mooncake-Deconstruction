<!DOCTYPE html>
<html lang="zh-CN">
<head>

      display: grid;
      min-height: 100vh;

      padding: 24px;
      place-items: center;

      width: min(100%, 560px);

    h1 { color: #e8c98a; letter-spacing: .12em; }

    a {

      padding: 16px;

    a:hover, a:focus-visible { background: #292218; border-color: #e8c98a; }

    <nav aria-label="选择演示">
