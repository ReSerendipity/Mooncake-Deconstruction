# mooncake-deconstruction: static integrity for zero-build HTML demo
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    name: Demo HTML/JS syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check demo-C2-月饼解构.html
        run: node check_syntax.js demo-C2-月饼解构.html
      - name: Check demo-C3-月饼3D.html
        run: node check_syntax.js demo-C3-月饼3D.html

  integrity:
    name: Static asset integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Verify demo files and local three.js exist
        run: |
          test -f demo-C2-月饼解构.html
          test -f demo-C3-月饼3D.html
          test -f three.module.local.js
          test -s README.md
